<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОП.09. Показатели качества и ISO 9000 — практическая работа</title>
<style>
/* ===== Практикум «Отдел качества»: сцена 1280×720, кегль в пунктах (не меньше 22 pt) ===== */
:root{
  --navy:#0B2545; --navy2:#13315C; --ink:#14213D; --muted:#4A5568; --line:#CBD5E1; --bg:#EEF2F7; --card:#FFFFFF;
  --acc:#E07A1F; --acc-soft:#FDEBD8; --blue:#1D4ED8; --blue-soft:#DBEAFE;
  --ok:#15803D; --ok-soft:#DCFCE7; --bad:#B91C1C; --bad-soft:#FEE2E2; --warn:#A16207; --warn-soft:#FEF9C3;
  --ff:"Segoe UI","PT Sans",Arial,sans-serif; --mono:Consolas,"PT Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1220}
body{font-family:var(--ff);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:4px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--bg);font-size:24pt;line-height:1.22}

/* шапка */
#top{position:absolute;left:0;right:0;top:0;height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:22pt}
#top .logo{height:46px;padding:0 10px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22pt;letter-spacing:-1px;flex:none}
#top .ttl{font-weight:700;white-space:nowrap}
#top .sp{flex:1}
#top .who{color:#BFD3F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
#top .pill{padding:2px 14px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:700;white-space:nowrap}
#top .clock{font-family:var(--mono);background:#1E3A8A}
#top .clock.warn{background:#A16207}#top .clock.crit{background:#B91C1C}
#top button{border:0;background:rgba(255,255,255,.12);color:#fff;width:46px;height:46px;border-radius:10px;font-size:22pt}
/* шаги */
#steps{position:absolute;left:0;right:0;top:58px;height:54px;background:var(--navy2);display:flex;align-items:center;justify-content:space-between;gap:0;padding:0 6px;font-size:22pt}
#steps button{border:0;background:transparent;color:#C7D5EA;height:44px;padding:0 5px;border-radius:10px;display:flex;align-items:center;gap:3px;white-space:nowrap}
#steps button:hover:not(:disabled){background:rgba(255,255,255,.1)}
#steps button.on{background:#fff;color:var(--navy);font-weight:700}
#steps button.done{color:#86EFAC}
#steps button.on.done{color:var(--ok)}
#steps button:disabled{opacity:.45}
#steps .n{font-weight:800;color:#FDBA74}
#steps button.on .n{color:var(--acc)}
#steps button.done .n{color:#22C55E}

/* карточка задания */
#card{position:absolute;left:10px;right:10px;top:120px;bottom:10px;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;flex-direction:column;overflow:hidden}
.ch{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:3px solid var(--acc);font-size:22pt}
.ch b{font-size:24pt;white-space:nowrap}
.ch .meta{color:var(--muted);white-space:nowrap}
.ch .sp{flex:1}
.badge{padding:2px 12px;border-radius:8px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.mid{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.new{background:var(--blue-soft);color:var(--blue)}
.tabs{flex:none;display:flex;gap:4px;padding:6px 12px 0;background:#F1F5F9;border-bottom:2px solid var(--line);font-size:22pt}
.tabs button{border:0;background:transparent;padding:2px 18px 6px;border-radius:10px 10px 0 0;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 -3px 0 var(--acc) inset}
.cb{flex:1;min-height:0;overflow:auto;padding:10px 18px}
.cf{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#F1F5F9;border-top:2px solid var(--line);font-size:22pt}
.cf .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

/* общие */
p{margin:0 0 8px}
h3{font-size:26pt;margin:0 0 8px;line-height:1.15}
.small{font-size:22pt}.muted{color:var(--muted)}
.btn{border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:2px 16px;font-weight:700;font-size:22pt;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--acc)}
.btn.b{background:var(--blue);border-color:var(--blue)}
.btn.r{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4}
.chip{border:2px solid #94A3B8;background:#fff;border-radius:999px;padding:0 14px;font-size:22pt;white-space:nowrap;line-height:1.5}
.chip:hover:not(:disabled){border-color:var(--acc)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);font-weight:700}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:#14532D;font-weight:700}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:#7F1D1D;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.chips .lbl{font-weight:700;color:var(--navy);margin-right:4px}
.box{border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff}
.box.blue{background:var(--blue-soft);border-color:#93C5FD}.box.acc{background:var(--acc-soft);border-color:#F6C08F}.box.ok{background:var(--ok-soft);border-color:#86EFAC}.box.bad{background:var(--bad-soft);border-color:#FCA5A5}
.src{color:var(--muted);font-style:italic;font-size:22pt}
input[type=text]{border:2px solid #94A3B8;border-radius:8px;padding:0 10px;background:#fff;font-size:22pt;width:100%;height:42px}
input[type=text]:focus{border-color:var(--acc)}
input.okf{border-color:var(--ok);background:var(--ok-soft)}input.badf{border-color:var(--bad);background:var(--bad-soft)}
table.tb{border-collapse:collapse;width:100%;font-size:22pt}
.tb th,.tb td{border:2px solid var(--line);padding:2px 10px;text-align:left;vertical-align:middle}
.tb th{background:#F1F5F9}
.tb td.c,.tb th.c{text-align:center}
.tb input{text-align:center;height:38px}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.nums button{min-width:52px;height:44px;border:2px solid #94A3B8;background:#fff;border-radius:10px;font-weight:700;font-size:22pt}
.nums button.ans{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.nums button.cur{outline:4px solid var(--acc);outline-offset:1px}
.nums button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.nums button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.qtxt{font-size:26pt;font-weight:700;line-height:1.18;margin-bottom:8px}
.fbk{margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.frm{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px;align-items:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:4px 0;border-bottom:2px solid #E2E8F0}
.prow .chips{flex-wrap:nowrap}
.qblk{margin-top:8px}.qblk .ql{font-weight:700;color:var(--navy)}
.tb.calc3 td{padding:0 10px}.tb.calc3 input{height:36px}

/* старт */
.start{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;height:100%}
.form{background:#F8FAFC;border:2px solid var(--line);border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;gap:6px;font-size:22pt}

/* итоги */
.res{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;height:100%}
.grade{width:120px;height:120px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:64pt;font-weight:800;color:#fff}
.g5{background:#15803D}.g4{background:#0F766E}.g3{background:#A16207}.g2{background:#B91C1C}
.big{font-size:48pt;font-weight:800;line-height:1}
.bars{display:flex;flex-direction:column;gap:10px;font-size:22pt}
.bar{display:grid;grid-template-columns:380px minmax(0,1fr) 100px;gap:12px;align-items:center}
.bar .tr{height:26px;background:#E2E8F0;border-radius:8px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:8px}
.bar .v{text-align:right;font-weight:700}
.lv{font-weight:700}.lv.l4{color:var(--ok)}.lv.l3{color:#0F766E}.lv.l2{color:var(--warn)}.lv.l1{color:var(--bad)}
.alist{display:flex;flex-direction:column;gap:6px;font-size:22pt}

/* диалог и уведомление */
#dlg{position:absolute;inset:0;background:rgba(11,18,32,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.dbox{background:#fff;border-radius:16px;min-width:620px;max-width:1180px;max-height:680px;overflow:auto;padding:16px 22px;box-shadow:0 30px 70px rgba(0,0,0,.5);font-size:22pt}
.dbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}
.dbox textarea{width:1120px;height:420px;font-family:var(--mono);font-size:22pt;border:2px solid var(--line);border-radius:10px;padding:8px}
.calc input{font-family:var(--mono)}
.calc .out{font-family:var(--mono);font-size:26pt;font-weight:700;color:var(--blue);min-height:40px}
.calc .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.calc .keys button{min-width:70px;height:46px;border:2px solid var(--line);background:#F8FAFC;border-radius:10px;font-family:var(--mono);font-size:22pt}
#toast{position:absolute;left:50%;top:5px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 22px;border-radius:12px;z-index:70;max-width:1100px;text-align:center;font-size:22pt;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#printArea{display:none}
@media print{body{overflow:visible;background:#fff}#stage{display:none}#printArea{display:block}}
</style>
</head>
<body>

  <div id="top"></div>
  <div id="steps"></div>
  <div id="card"></div>
  <div id="dlg" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<div id="printArea"></div>

function calc(expr){const s=String(expr).replace(/,/g,'.').replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');let i=0;const pk=()=>s[i];
 const num=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};

  const f=s.slice(i).match(/^(exp|ln|sqrt|e)/);if(f){i+=f[1].length;if(f[1]==='e')return Math.E;if(s[i]!=='(')throw 0;i++;const v=add();if(s[i]!==')')throw 0;i++;return f[1]==='exp'?Math.exp(v):f[1]==='ln'?Math.log(v):Math.sqrt(v)}return num()};

 const mul=()=>{let v=pow();while(pk()==='*'||pk()==='/'){const o=s[i++],r=pow();v=o==='*'?v*r:v/r}return v};
 const add=()=>{let v=mul();while(pk()==='+'||pk()==='-'){const o=s[i++],r=mul();v=o==='+'?v+r:v-r}return v};
 const v=add();if(i<s.length||!isFinite(v))throw 0;return v}

 t6f(v){if(S.t6.done)return;S.t6.f[S.t6.cur]=+v;const nx=FIND.findIndex((f,i)=>S.t6.f[i]==null);if(nx>=0)S.t6.cur=nx;renderCard(true)},
 t6a(v){if(S.t6.done)return;const [i,j]=v.split(':').map(Number);S.t6.a[i]=j;renderCard(true)}
};
let REPORT='';
function adv2(){const nx=IND.findIndex((x,i)=>S.t2.g[i]==null||(x[2]!=null&&S.t2.m[i]==null));if(nx>=0)S.t2.cur=nx}
function copyRep(){const t=$('#rep');let ok=false;try{if(navigator.clipboard){navigator.clipboard.writeText(REPORT);ok=true}}catch(e){}if(!ok&&t){t.select();try{ok=document.execCommand('copy')}catch(e){}}toast(ok?'Отчёт скопирован':'Выделите текст и скопируйте вручную')}
stage.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b,e)});
stage.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;const p=k.split('.');S[p[0]][p[1]][p[2]]=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').classList.contains('hidden'))closeDlg()});
window.addEventListener('beforeunload',e=>{if(S.t0&&!S.fin){e.preventDefault();e.returnValue=''}});
function tick(){const el=$('#clock');if(!el)return;if(!S.t0){el.textContent='90:00';return}const now=S.fin?S.tEnd:Date.now();const rem=Math.max(0,S.limit-Math.floor((now-S.t0)/1000));el.textContent=`${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;el.className='pill clock'+(rem<=300?' crit':rem<=900?' warn':'');if(rem<=0&&!S.fin)finish(true)}
setInterval(tick,500);
function finish(byTime){if(S.fin)return;S.fin=true;S.tEnd=Date.now();S.view='res';S.rtab=0;render();dialog(byTime?'Время вышло':'Работа сдана',`<p>Результат: <b>${fmt(total())} из 100</b>. Сохраните отчёт кнопкой «Отчёт».</p>`,[{t:'К итогам'}])}
render();
window.APP={S,ACT,DEFS,IND,R3,Q4,QA,QB,T4Q,SIT,PDCA,FIND,ACTS,total,SC,calc,reportHTML,reportTXT,render};
})();
